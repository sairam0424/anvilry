name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore pnpm store cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      # .velite/ is gitignored — must be generated before tsc or vitest runs.
      # Mirrors the production build order: velite --clean && vitest run && next build
      - name: Generate Velite content types
        run: pnpm content

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: pnpm test

      # Deliberately a CI step and NOT part of `pnpm build`.
      #
      # This verifies the docs/index/ codebase index still cites the lines it claims. It was
      # briefly wired into a vitest test, which meant it ran inside `vitest run` — which
      # `pnpm build` chains — so a stale INDEX would have failed the VERCEL PRODUCTION BUILD.
      # Documentation freshness must gate a merge, never a deploy: otherwise a stale doc blocks
      # shipping a hotfix. Here it fails the PR, which is the right level.
      #
      # On drift, the script names the file, the recorded line, the current line, and which index
      # file cites it. Re-fingerprint with: node scripts/check-index-citations.mjs --write
      - name: Codebase index citations
        run: node scripts/check-index-citations.mjs

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Wired in deliberately: `pnpm e2e` was referenced by NO workflow, so the suite rotted
    # unnoticed until 5 of 19 tests were failing on selectors that could never match. A gate that
    # nobody runs provides zero signal. playwright.config.ts now carries a `webServer` block, so
    # this job needs no manual server step.

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Pin the browser download to the installed @playwright/test version. A version/browser
      # mismatch fails with "Executable doesn't exist at .../chromium_headless_shell-<rev>".
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # webServer runs `pnpm start`, which needs a production build present.
      - name: Build
        run: pnpm build

      # Rides on the build above rather than adding a second one. `pnpm build` ends in a bare
      # `next build` => Turbopack => it writes .next/diagnostics/route-bundle-stats.json, which is
      # the only per-route first-load artifact Next 16 emits (the `size`/`First Load JS` build-table
      # columns were removed in 16).
      #
      # No continue-on-error and no if-no-files-found here on purpose. This step REPLACES
      # bundle-analysis.yml, which ran 222 times — 211 green, 11 red — and produced ZERO artifacts,
      # ever. Be precise about why: its install/build failures DID go red (that is 9 of the 11), so it
      # was not unfailable outright. What it could never do was fail on a bundle SIZE, because it had
      # no threshold, and `if-no-files-found: warn` on the upload plus continue-on-error on the
      # compare meant a missing measurement passed silently. Unmeasurable must mean red.
      - name: Bundle budget
        run: node scripts/bundle-budget.mjs

      - name: Run E2E
        run: pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  install-pnpm-11:
    name: Install on pnpm 11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # WHY THIS JOB EXISTS
    # The `ci` job above pins `version: 10`, which is correct — but it means no green run has ever
    # exercised the pnpm the rest of the world actually installs. `npm i -g pnpm` resolves to 11.
    #
    # That gap shipped a real defect: pnpm 11 removed `onlyBuiltDependencies` /
    # `ignoredBuiltDependencies` in favour of the boolean `allowBuilds` map, so
    # `pnpm install --frozen-lockfile` exited 1 for every contributor on the default pnpm while CI
    # stayed green, AND pnpm 11 silently rewrote the tracked pnpm-workspace.yaml with a
    # `set this to true or false` placeholder. Nothing in the repo could have caught it: "CI passes"
    # and "the repo installs" were different claims and only the first was being checked.
    #
    # This job checks the second claim. Keep it as its own job, not a step in `ci` — it must run a
    # different pnpm major, and it must be allowed to fail loudly without masking lint/type/test.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm 11
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # No cache: a cold resolve is the point. A warm store could mask a resolution failure.
      - name: Install with the lockfile frozen
        run: pnpm install --frozen-lockfile

      # pnpm 11 seeds `allowBuilds` into pnpm-workspace.yaml when it is missing or incomplete. That
      # write is the signature of the bug even on runs where the install itself exits 0, so treat any
      # modification to a tracked file as a failure and print the diff.
      - name: Fail if pnpm 11 modified a tracked file
        run: |
          if ! git diff --exit-code; then
            echo "::error::pnpm 11 modified a tracked file during install (see diff above)."
            echo "::error::Most likely pnpm-workspace.yaml gained an allowBuilds placeholder."
            exit 1
          fi

      - name: Confirm the build-script allowlist covers the resolved tree
        run: npx vitest run src/lib/pnpm-build-allowlist-consistency.test.ts

  security-alerts:
    name: Security alerts (report)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # NON-BLOCKING BY DESIGN (continue-on-error). Its job is VISIBILITY, not enforcement.
    #
    # Why this exists: a HIGH-severity arbitrary-JS-execution advisory (pdfjs-dist) sat open while
    # the "Dependabot Updates" workflow failed for 4 consecutive runs with the reason buried inside
    # its log (`security_update_not_possible`). 23 alerts across 10 packages had accumulated and
    # nothing surfaced them.
    #
    # IMPORTANT TOKEN LIMITATION: the default GITHUB_TOKEN CANNOT read the Dependabot alerts API,
    # even with `security-events: read` declared. That endpoint requires a PAT carrying the
    # `security_events` (or `repo`) scope — the restriction is on the token TYPE, not the declared
    # permission. Verified empirically: with GITHUB_TOKEN this step reported
    # "Could not read Dependabot alerts", i.e. it passed while surfacing nothing.
    #
    # TO ENABLE: create a fine-grained PAT with Repository permissions ->
    # "Dependabot alerts: Read-only", save it as the repo secret SECURITY_ALERTS_TOKEN, and this
    # step starts reporting. Until then it prints actionable setup instructions instead of a
    # misleading green tick.
    #
    # Promote to blocking (drop continue-on-error, exit 1 on high/critical) once a token is wired
    # AND the existing backlog is at zero.
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Report open Dependabot alerts
        env:
          GH_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}
        run: |
          set +e
          if [ -z "${GH_TOKEN}" ]; then
            {
              echo "## Security alert reporting is NOT ENABLED"
              echo ""
              echo "The default \`GITHUB_TOKEN\` cannot read the Dependabot alerts API, so this"
              echo "step needs its own token."
              echo ""
              echo "**To enable:**"
              echo "1. Create a fine-grained PAT with Repository permissions -> \`Dependabot alerts: Read-only\`"
              echo "2. Add it as the repository secret \`SECURITY_ALERTS_TOKEN\`"
              echo ""
              echo "Until then, check manually:"
              echo "\`\`\`"
              echo "gh api repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open --jq length"
              echo "\`\`\`"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          alerts=$(gh api "repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" 2>/dev/null)
          if [ -z "$alerts" ] || ! printf '%s' "$alerts" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "SECURITY_ALERTS_TOKEN is set but the alerts API was unreadable — check that the PAT grants 'Dependabot alerts: Read-only' and has not expired." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          total=$(printf '%s' "$alerts" | jq 'length')
          {
            echo "## Open Dependabot alerts: ${total}"
            echo ""
            if [ "$total" = "0" ]; then
              echo "No open alerts."
            else
              echo "| Severity | Count |"
              echo "|---|---|"
              printf '%s' "$alerts" | jq -r '[.[].security_advisory.severity] | group_by(.)
                | map({s: .[0], n: length}) | .[] | "| \(.s) | \(.n) |"'
              echo ""
              echo "### Affected packages"
              printf '%s' "$alerts" | jq -r '[.[].dependency.package.name] | unique | .[] | "- \(.)"'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Deliberately exits 0 — see the comment on this job.
