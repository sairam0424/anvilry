name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      # .velite/ is gitignored — must be generated before tsc or vitest runs.
      # Mirrors the production build order: velite --clean && vitest run && next build
      - name: Generate Velite content types
        run: pnpm content

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: pnpm test

      # Deliberately a CI step and NOT part of `pnpm build`.
      #
      # This verifies the docs/index/ codebase index still cites the lines it claims. It was
      # briefly wired into a vitest test, which meant it ran inside `vitest run` — which
      # `pnpm build` chains — so a stale INDEX would have failed the VERCEL PRODUCTION BUILD.
      # Documentation freshness must gate a merge, never a deploy: otherwise a stale doc blocks
      # shipping a hotfix. Here it fails the PR, which is the right level.
      #
      # On drift, the script names the file, the recorded line, the current line, and which index
      # file cites it. Re-fingerprint with: node scripts/check-index-citations.mjs --write
      - name: Codebase index citations
        run: node scripts/check-index-citations.mjs

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Wired in deliberately: `pnpm e2e` was referenced by NO workflow, so the suite rotted
    # unnoticed until 5 of 19 tests were failing on selectors that could never match. A gate that
    # nobody runs provides zero signal. playwright.config.ts now carries a `webServer` block, so
    # this job needs no manual server step.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Pin the browser download to the installed @playwright/test version. A version/browser
      # mismatch fails with "Executable doesn't exist at .../chromium_headless_shell-<rev>".
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # webServer runs `pnpm start`, which needs a production build present.
      - name: Build
        run: pnpm build

      - name: Run E2E
        run: pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security-alerts:
    name: Security alerts (report)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # NON-BLOCKING BY DESIGN (continue-on-error). Its job is VISIBILITY, not enforcement.
    #
    # Why this exists: a HIGH-severity arbitrary-JS-execution advisory (pdfjs-dist) sat open while
    # the "Dependabot Updates" workflow failed for 4 consecutive runs with the reason buried inside
    # its log (`security_update_not_possible`). 23 alerts across 10 packages had accumulated and
    # nothing surfaced them.
    #
    # IMPORTANT TOKEN LIMITATION: the default GITHUB_TOKEN CANNOT read the Dependabot alerts API,
    # even with `security-events: read` declared. That endpoint requires a PAT carrying the
    # `security_events` (or `repo`) scope — the restriction is on the token TYPE, not the declared
    # permission. Verified empirically: with GITHUB_TOKEN this step reported
    # "Could not read Dependabot alerts", i.e. it passed while surfacing nothing.
    #
    # TO ENABLE: create a fine-grained PAT with Repository permissions ->
    # "Dependabot alerts: Read-only", save it as the repo secret SECURITY_ALERTS_TOKEN, and this
    # step starts reporting. Until then it prints actionable setup instructions instead of a
    # misleading green tick.
    #
    # Promote to blocking (drop continue-on-error, exit 1 on high/critical) once a token is wired
    # AND the existing backlog is at zero.
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Report open Dependabot alerts
        env:
          GH_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}
        run: |
          set +e
          if [ -z "${GH_TOKEN}" ]; then
            {
              echo "## Security alert reporting is NOT ENABLED"
              echo ""
              echo "The default \`GITHUB_TOKEN\` cannot read the Dependabot alerts API, so this"
              echo "step needs its own token."
              echo ""
              echo "**To enable:**"
              echo "1. Create a fine-grained PAT with Repository permissions -> \`Dependabot alerts: Read-only\`"
              echo "2. Add it as the repository secret \`SECURITY_ALERTS_TOKEN\`"
              echo ""
              echo "Until then, check manually:"
              echo "\`\`\`"
              echo "gh api repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open --jq length"
              echo "\`\`\`"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          alerts=$(gh api "repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" 2>/dev/null)
          if [ -z "$alerts" ] || ! printf '%s' "$alerts" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "SECURITY_ALERTS_TOKEN is set but the alerts API was unreadable — check that the PAT grants 'Dependabot alerts: Read-only' and has not expired." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          total=$(printf '%s' "$alerts" | jq 'length')
          {
            echo "## Open Dependabot alerts: ${total}"
            echo ""
            if [ "$total" = "0" ]; then
              echo "No open alerts."
            else
              echo "| Severity | Count |"
              echo "|---|---|"
              printf '%s' "$alerts" | jq -r '[.[].security_advisory.severity] | group_by(.)
                | map({s: .[0], n: length}) | .[] | "| \(.s) | \(.n) |"'
              echo ""
              echo "### Affected packages"
              printf '%s' "$alerts" | jq -r '[.[].dependency.package.name] | unique | .[] | "- \(.)"'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Deliberately exits 0 — see the comment on this job.
