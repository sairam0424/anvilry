name: Gitleaks

# Redundant, always-on secret scan for every PR into develop/main.
#
# GitHub's native secret scanning + push protection are already enabled on this repo
# (confirmed via the API), and .coderabbit.yaml enables CodeRabbit's own gitleaks tool —
# but that config currently lives only on develop, and per this repo's 0-star status,
# CodeRabbit's free-tier auto-review requires a manual @coderabbitai comment per PR
# rather than running unconditionally. This workflow runs unconditionally on every PR
# regardless of stars, CodeRabbit config location, or a maintainer remembering to trigger it.
#
# No GITLEAKS_LICENSE is set: gitleaks-action is free for personal-account repos (this one)
# and only requires a license for GitHub Organizations.
on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # gitleaks-action calls the PR review-comment API when it finds a leak.
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
