# pnpm settings live HERE, not in package.json's `pnpm` field.
#
# WHY THIS MOVED: pnpm v11 no longer reads the `pnpm` field of package.json at all — it prints
# "The "pnpm" field in package.json is no longer read by pnpm" and skips it. Every setting below
# was previously in that field, which meant that on pnpm 11 the ten security `overrides` shipped
# in v3.4.2 were being IGNORED. CI pins pnpm 10 and pnpm-lock.yaml already encodes them, so
# resolution was correct in CI — but one `pnpm install` on pnpm 11 would have regenerated the
# lockfile WITHOUT the overrides block and silently reverted that security release.
#
# Both pnpm 10 and 11 read settings from this file, so this is the single source of truth that
# works on either. Verified by regenerating the lockfile with both and diffing the `overrides:`
# block. See docs: https://pnpm.io/settings/dependency-resolution and https://pnpm.io/configuring

# --- Dependency resolution -------------------------------------------------------------------
# Transitive-dependency pins resolving the 23 Dependabot advisories that v3.4.2 shipped.
# These are SECURITY-LOAD-BEARING. Do not remove one without confirming the advisory is closed
# by the resolved graph — `pnpm why <pkg>` and the CHANGELOG entry for 3.4.2 are the references.
overrides:
  hono: 4.13.13
  '@hono/node-server': ^1.19.15
  ip-address: 10.7.4
  # Exact, not a caret range: pnpm 11's default minimumReleaseAge check rejects a lockfile entry
  # resolved to a version published too recently (caught 3.1.7, published <24h before a CI
  # run, on the "Install on pnpm 11" job). 3.1.9 (2026-10-19, outside Dependabot #62/#65/#74/
  # #115) has aged past that; a caret range would just re-resolve to whatever is newest at
  # install time and fail again the next time a patch lands. Bump deliberately.
  fast-uri: 3.1.9
  js-yaml: ^4.3.1
  postcss: ^8.5.23
  brace-expansion@1: ^1.1.21
  brace-expansion@>=3: ^5.0.12
  sharp: 0.35.5
  body-parser: 2.4.0
  # GHSA-covered crash/prototype-write + OOM (Dependabot #54/#55), transitive via
  # next -> styled-jsx and eslint-config-next -> @babel/core. Exact, not caret, same
  # minimumReleaseAge reasoning as fast-uri above: 4.28.8 (2026-08-08) is aged; bump
  # deliberately, don't let it float to whatever's newest at install time.
  browserslist: 4.28.8
  # Dependabot #87 (IP spoofing, via express) and #88 (event-loop DoS, via postcss/next).
  proxy-addr: ^2.0.8
  source-map-js: ^1.2.2
  # GHSA-covered DoS + array-limit bypass (Dependabot #53/#56), transitive via
  # body-parser -> express -> @modelcontextprotocol/sdk. 6.16.1 (2026-10-14) is the oldest
  # release outside the advisory range (<=6.16.0); 6.16.2 and 6.17.x were younger than the
  # 7-day Dependabot cooldown when this was pinned. If pnpm 11's release-age gate
  # rejects it, that's the CI signal to wait and retry, not a reason to skip the fix.
  qs: 6.16.1

# Local patches applied via `pnpm patch` — see `patches/`. Kept separate from `overrides`
# (version pins) since a patch edits a specific resolved version's own files, not which
# version resolves.
patchedDependencies:
  # pmndrs/react-three-fiber#3754: connect() called addEventListener on a null/undefined
  # target with no guard, unlike disconnect()'s matching check — crashes the hero graph's
  # WebGL canvas on unmount/remount races. Fixed upstream is not yet released against
  # 9.7.0; drop this patch when it is.
  '@react-three/fiber@9.7.0': patches/@react-three__fiber@9.7.0.patch

# --- Build scripts ---------------------------------------------------------------------------
# THE ALLOWLIST IS SPELLED TWICE. `allowBuilds` is the one that matters; the two lists below are
# legacy. They are kept in sync anyway, and a test enforces that — see the pointer under the map.
#
# pnpm 11 REMOVED onlyBuiltDependencies / ignoredBuiltDependencies (pnpm.io/settings/build). It does
# not consult them for build approval and prints no warning; `ignoredBuiltDependencies` appears
# nowhere in the pnpm 11 binary. Beware the tempting non-evidence: `pnpm config get
# onlyBuiltDependencies` echoes ANY key present in this file, including one that does not exist.
#
# Measured on a one-install-script fixture with `allowBuilds` alone and NO legacy keys:
#   pnpm 11.17.0 ok · 10.34.5 ok · 10.28.0 ok · 10.27.1 EXIT 1, binary not built
# So the lists are dead config for CI (`version: 10` resolves to latest-10 = 10.34.5) and survive
# only for pnpm <=10.27. Without `allowBuilds`, pnpm 11 exits 1 and seeds a `set this to true or
# false` placeholder into this tracked file — written BY the failing run, not the cause of it.
onlyBuiltDependencies: # legacy; honoured only by pnpm <=10.27
  - esbuild

# Explicitly denied, so pnpm stops prompting about them.
ignoredBuiltDependencies: # legacy; honoured only by pnpm <=10.27
  - sharp
  - unrs-resolver

# The live setting, honoured by pnpm >=10.28 and 11. Booleans only — never the placeholder string
# pnpm writes here itself. Every dependency declaring an install script must appear here explicitly;
# src/lib/pnpm-build-allowlist-consistency.test.ts derives that set from the resolved tree.
allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
